<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词记 · 单词过关</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    /* 两块卡片竖向堆叠 */
    flex-direction: column;

    /* 蓝色渐变背景 */
    background: linear-gradient(160deg, #1e3a8a 0%, #2563eb 45%, #38bdf8 100%);
    background-attachment: fixed;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Microsoft YaHei", sans-serif;
    color: #1f2328;
  }

  /* 柔光遮罩：避免大面积纯色显得死板 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.18), transparent 55%),
      radial-gradient(circle at 80% 80%, rgba(56,189,248,.22), transparent 55%);
    z-index: 0;
    pointer-events: none;
  }

  /* ---- 左上角 logo ---- */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 22px 28px;
  }

  .logo-mark {
    width: 34px;
    height: 34px;
    flex: none;
  }

  .logo-name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(15, 23, 42, .35);
  }

  /* ---- 主卡片（比登录页大很多）---- */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 820px;
    margin: 100px 24px 32px;
    padding: 48px 56px 44px;
    background: #fff;
    border-radius: 18px;
    box-shadow:
      0 1px 2px rgba(15, 23, 42, .06),
      0 12px 28px rgba(15, 23, 42, .14),
      0 32px 72px rgba(15, 23, 42, .22);
  }

  /* 主卡片顶部一道细高光，提升质感 */
  .card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
    pointer-events: none;
  }

  /* ---- 上方统计方块（独立卡片，不参与翻页）---- */
  .card-stats {
    margin: 100px 24px 16px;      /* 底部 16px 是两块之间的间距 */
    padding: 22px 28px;
    border-radius: 16px;
    max-width: 820px;
    box-shadow:
      0 1px 2px rgba(15, 23, 42, .05),
      0 8px 20px rgba(15, 23, 42, .12),
      0 20px 44px rgba(15, 23, 42, .16);
  }

  /* ---- 顶部统计 ---- */
  .stats {
    display: flex;
    gap: 12px;
  }

  .stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 14px 12px;
    background: #f7f9fc;
    border: 1px solid #eef2f7;
    border-radius: 12px;
    text-align: center;
    transition: background .2s;
  }

  .stat:hover { background: #f1f5fa; }

  .stat-label {
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: .5px;
  }

  .stat-value {
    font-size: 23px;
    font-weight: 700;
    color: #1f2328;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
    display: inline-block;
  }

  /* 统计数字更新时的切进效果（幅度加大，看得更清楚）*/
  @keyframes statPop {
    0%   { transform: translateY(-16px) scale(.7);  opacity: 0; }
    55%  { transform: translateY(3px)   scale(1.18); opacity: 1; }
    78%  { transform: translateY(-1px)  scale(.96); opacity: 1; }
    100% { transform: translateY(0)     scale(1);   opacity: 1; }
  }

  .stat-value.bump { animation: statPop .55s cubic-bezier(.34, 1.4, .64, 1) both; }

  .stat-value.good { color: #16a34a; }
  .stat-value.bad  { color: #dc2626; }

  /* ---- 滑动面板（3D 翻页）---- */
  .stage {
    position: relative;
    overflow: hidden;      /* 关键：滑出屏幕的部分必须被裁掉，否则看不到翻页 */
    border-radius: 14px;
    perspective: 1400px;   /* 建立 3D 纵深，让 rotateY 有透视感 */
  }

  .panel {
    padding: 4px;
    border: 2px solid transparent;
    border-radius: 14px;
    transition: border-color .3s, box-shadow .3s;
  }

  /* 答对：绿色荧光
     多层 box-shadow 由外到内递减透明度，形成向外扩散的光晕；
     内侧再用 inset 叠一层，做出「由外到内变浅」的渐变感 */
  .panel.right {
    border-color: #22c55e;
    box-shadow:
      inset 0 0 0 1px rgba(34, 197, 94, .18),
      inset 0 0 12px rgba(34, 197, 94, .10),
      0 0 4px  rgba(34, 197, 94, .85),
      0 0 10px rgba(34, 197, 94, .60),
      0 0 20px rgba(34, 197, 94, .38),
      0 0 34px rgba(34, 197, 94, .20),
      0 0 52px rgba(34, 197, 94, .10);
    animation: glowGreen 1.5s ease-in-out infinite;
  }

  @keyframes glowGreen {
    0%, 100% {
      box-shadow:
        inset 0 0 0 1px rgba(34, 197, 94, .18),
        inset 0 0 12px rgba(34, 197, 94, .10),
        0 0 4px  rgba(34, 197, 94, .85),
        0 0 10px rgba(34, 197, 94, .60),
        0 0 20px rgba(34, 197, 94, .38),
        0 0 34px rgba(34, 197, 94, .20),
        0 0 52px rgba(34, 197, 94, .10);
    }
    50% {
      box-shadow:
        inset 0 0 0 1px rgba(34, 197, 94, .26),
        inset 0 0 16px rgba(34, 197, 94, .16),
        0 0 6px  rgba(34, 197, 94, 1),
        0 0 14px rgba(34, 197, 94, .75),
        0 0 28px rgba(34, 197, 94, .48),
        0 0 44px rgba(34, 197, 94, .26),
        0 0 68px rgba(34, 197, 94, .13);
    }
  }

  /* 答错：红色荧光 */
  .panel.wrong {
    border-color: #ef4444;
    box-shadow:
      inset 0 0 0 1px rgba(239, 68, 68, .18),
      inset 0 0 12px rgba(239, 68, 68, .10),
      0 0 4px  rgba(239, 68, 68, .85),
      0 0 10px rgba(239, 68, 68, .60),
      0 0 20px rgba(239, 68, 68, .38),
      0 0 34px rgba(239, 68, 68, .20),
      0 0 52px rgba(239, 68, 68, .10);
    animation: glowRed .8s ease-in-out infinite;
  }

  @keyframes glowRed {
    0%, 100% {
      box-shadow:
        inset 0 0 0 1px rgba(239, 68, 68, .18),
        inset 0 0 12px rgba(239, 68, 68, .10),
        0 0 4px  rgba(239, 68, 68, .85),
        0 0 10px rgba(239, 68, 68, .60),
        0 0 20px rgba(239, 68, 68, .38),
        0 0 34px rgba(239, 68, 68, .20),
        0 0 52px rgba(239, 68, 68, .10);
    }
    50% {
      box-shadow:
        inset 0 0 0 1px rgba(239, 68, 68, .28),
        inset 0 0 18px rgba(239, 68, 68, .18),
        0 0 7px  rgba(239, 68, 68, 1),
        0 0 16px rgba(239, 68, 68, .78),
        0 0 30px rgba(239, 68, 68, .50),
        0 0 48px rgba(239, 68, 68, .28),
        0 0 72px rgba(239, 68, 68, .14);
    }
  }

  /* 翻页：当前页向左滑出
     幅度加大（位移更远、旋转更多、缩小更多），让翻页动作看得清 */
  @keyframes slideOutLeft {
    0% {
      transform: translateX(0) rotateY(0deg) scale(1);
      opacity: 1;
      filter: blur(0);
    }
    35% {
      /* 先"抬起"一下，形成加速感 */
      transform: translateX(-28%) rotateY(-10deg) scale(.96);
      opacity: .92;
      filter: blur(1px);
    }
    100% {
      transform: translateX(-135%) rotateY(-42deg) scale(.78);
      opacity: 0;
      filter: blur(8px);
    }
  }

  /* 翻页：新页从右侧滑入 */
  @keyframes slideInRight {
    0% {
      transform: translateX(135%) rotateY(38deg) scale(.78);
      opacity: 0;
      filter: blur(8px);
    }
    55% {
      opacity: .9;
      filter: blur(2px);
    }
    100% {
      transform: translateX(0) rotateY(0deg) scale(1);
      opacity: 1;
      filter: blur(0);
    }
  }

  .panel {
    transform-origin: center left;   /* 绕左侧轴翻转，更像翻书 */
    backface-visibility: hidden;
    will-change: transform, opacity, filter;
  }

  /* 时长：比之前慢近一倍，动作更从容 */
  .panel.out { animation: slideOutLeft .75s cubic-bezier(.55, 0, .8, .25) both; }
  .panel.in  { animation: slideInRight .75s cubic-bezier(.2, .9, .3, 1) both; }

  /* 答错：整块卡片抖动 */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15%      { transform: translateX(-9px); }
    30%      { transform: translateX(8px); }
    45%      { transform: translateX(-6px); }
    60%      { transform: translateX(5px); }
    75%      { transform: translateX(-3px); }
    90%      { transform: translateX(2px); }
  }

  .card.shake { animation: shake .45s cubic-bezier(.36, .07, .19, .97) both; }

  /* 尊重系统的「减少动态效果」设置 */
  @media (prefers-reduced-motion: reduce) {
    .panel.out, .panel.in, .card.shake { animation-duration: .01ms; }
    .panel.right, .panel.wrong { animation: none; }
  }

  /* ---- 题目区 ---- */
  .quiz-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #94a3b8;
  }

  /* 标签两侧的细线 */
  .quiz-label::before,
  .quiz-label::after {
    content: '';
    width: 34px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #dbe2ea);
  }

  .quiz-label::after {
    background: linear-gradient(90deg, #dbe2ea, transparent);
  }

  /* 题面容器：词性 + 中文单词 排在同一行 */
  .question {
    display: flex;
    flex-direction: row;
    align-items: baseline;      /* 按基线对齐，词性和文字底部齐平 */
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 104px;
    margin-bottom: 22px;
    text-align: center;
  }

  /* 中文单词 */
  .q-word {
    font-size: 46px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: 2px;
    color: #0f172a;
    word-break: break-word;
  }

  /* 词性：放在单词前面，字号与中文一致，颜色沿用正文色 */
  .q-pos {
    font-size: 46px;            /* 和 .q-word 保持一致 */
    font-weight: 400;           /* 比单词细，避免抢主体 */
    line-height: 1.25;
    letter-spacing: 0;
    color: #0f172a;             /* 和单词同色 */
    white-space: nowrap;
  }

  .q-pos:empty { display: none; }

  /* 提示区预留高度，出现时不会把下面的内容顶下去 */
  .tip-slot {
    min-height: 0;
    margin-bottom: 20px;
    transition: min-height .2s;
  }

  .hint {
    margin-bottom: 28px;
    font-size: 13px;
    text-align: center;
    color: #94a3b8;
  }

  /* ---- 自动提示（首字母）---- */
  .tip {
    display: none;
    margin: 0 0 24px;
    padding: 16px 20px;
    text-align: center;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 11px;
  }

  .tip.show { display: block; }

  /* 首字母独立一行 */
  .tip .letters {
    display: block;
    margin-bottom: 8px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 6px;
    color: #b45309;
  }

  /* 说明文字另起一行 */
  .tip .tip-text {
    display: block;
    font-size: 13px;
    line-height: 1.5;
    color: #92400e;
  }

  .hint code {
    padding: 1px 6px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    color: #475569;
    background: #f1f5f9;
    border-radius: 4px;
  }

  /* ---- 输入 ---- */
  .answer-row {
    display: flex;
    gap: 12px;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 17px 22px;
    font-size: 21px;
    font-family: Consolas, "Courier New", monospace;
    letter-spacing: 1px;
    color: #1f2328;
    background: #fbfcfe;
    border: 2px solid #dde4ed;
    border-radius: 12px;
    outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }

  input[type="text"]::placeholder {
    color: #b6c0cd;
    letter-spacing: .5px;
  }

  input[type="text"]:hover:not(:disabled):not(:focus) {
    border-color: #c8d3e0;
  }

  input[type="text"]:focus {
    background: #fff;
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, .13);
  }

  input[type="text"].right {
    border-color: #16a34a;
    box-shadow: 0 0 0 4px rgba(22, 163, 74, .13);
  }

  input[type="text"].wrong {
    border-color: #dc2626;
    box-shadow: 0 0 0 4px rgba(220, 38, 38, .13);
  }

  input[type="text"]:disabled {
    color: #94a3b8;
    background: #f8fafc;
  }

  .btn {
    flex: none;
    padding: 0 34px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(180deg, #3b82f6, #2563eb);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(37, 99, 235, .28);
    transition: background .18s, box-shadow .18s, transform .08s;
  }

  .btn:hover {
    background: linear-gradient(180deg, #2f76e8, #1d4ed8);
    box-shadow: 0 4px 12px rgba(37, 99, 235, .34);
  }

  .btn:active {
    transform: translateY(1px) scale(.985);
    box-shadow: 0 1px 3px rgba(37, 99, 235, .3);
  }

  .btn:disabled {
    background: #cbd5e1;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  .btn.ghost {
    color: #526075;
    background: #f4f6f9;
    border: 1px solid #e4e9f0;
    box-shadow: none;
  }

  .btn.ghost:hover {
    color: #1f2937;
    background: #eaeef4;
    box-shadow: none;
  }

  /* ---- 反馈 ---- */
  .feedback {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-top: 26px;
    padding: 17px 22px;
    font-size: 15px;
    border-radius: 12px;
    border-left-width: 4px;
    border-left-style: solid;
  }

  .feedback.show {
    display: flex;
    animation: fbIn .3s ease-out both;
  }

  @keyframes fbIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .feedback.ok {
    color: #14532d;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-left-color: #22c55e;
  }

  .feedback.no {
    color: #7f1d1d;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-left-color: #ef4444;
  }

  .feedback .text {
    flex: 1;
    line-height: 1.6;
  }

  .feedback b {
    font-family: Consolas, "Courier New", monospace;
    font-size: 16px;
  }

  /* 反馈里的按钮组 */
  .fb-actions {
    flex: none;
    display: flex;
    gap: 8px;
  }

  .fb-actions .btn {
    padding: 10px 20px;
    font-size: 14px;
  }

  /* 答对：主按钮绿色 */
  .feedback.ok .btn:not(.ghost) { background: #16a34a; }
  .feedback.ok .btn:not(.ghost):hover { background: #15803d; }

  /* 答错：主按钮红色 */
  .feedback.no .btn:not(.ghost) { background: #dc2626; }
  .feedback.no .btn:not(.ghost):hover { background: #b91c1c; }

  /* 「跳过」用更中性的样式，避免和「重试」抢注意力 */
  .feedback.no #skip {
    color: #991b1b;
    background: #fff;
    border: 1px solid #fecaca;
  }

  .feedback.no #skip:hover { background: #fee2e2; }

  /* ---- 底部操作 ---- */
  .foot {
    display: flex;
    justify-content: space-between;   /* 跳过在左，重新开始在右 */
    gap: 10px;
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid #eef1f5;
  }

  .foot .btn { padding: 11px 22px; font-size: 14px; }

  /* 「跳过」用偏暖的色调，和「重新开始」区分开 */
  #skip {
    color: #b45309;
    background: #fffbeb;
    border: 1px solid #fde68a;
  }

  #skip:hover {
    color: #92400e;
    background: #fef3c7;
  }

  /* ---- 空词库提示 ---- */
  .empty {
    display: none;
    padding: 18px;
    font-size: 14px;
    line-height: 1.7;
    color: #7f1d1d;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 10px;
  }

  .empty.show { display: block; }
  .empty code {
    padding: 1px 6px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    background: #fff;
    border-radius: 4px;
  }

  /* ---- 本轮进度：在统计面板里高亮显示 ---- */
  .stat-round {
    background: #eef4ff;
    border-color: #dbe7fe;
  }

  .stat-round .stat-label { color: #6d8ac0; }
  .stat-round .stat-value { color: #2563eb; }

  /* ---- 错题本弹窗 ---- */
  .modal-mask {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    padding: 24px;
    background: rgba(15, 23, 42, .55);
    backdrop-filter: blur(3px);
    overflow-y: auto;
  }

  .modal-mask.show {
    display: flex;
    align-items: center;
    justify-content: center;
    animation: maskIn .22s ease-out both;
  }

  @keyframes maskIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .modal {
    width: 100%;
    max-width: 520px;
    max-height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
    padding: 30px 32px 26px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 24px 64px rgba(15, 23, 42, .38);
    animation: modalIn .28s cubic-bezier(.2, .9, .3, 1) both;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(16px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-title {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    color: #0f172a;
  }

  .modal-sub {
    margin: 0 0 20px;
    font-size: 13px;
    text-align: center;
    color: #94a3b8;
  }

  /* 错题列表 */
  .modal-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin-bottom: 18px;
    padding: 4px;
  }

  .wb-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 11px 14px;
    margin-bottom: 8px;
    background: #fef2f2;
    border: 1px solid #fee2e2;
    border-radius: 10px;
  }

  .wb-row:last-child { margin-bottom: 0; }

  .wb-pos {
    flex: none;
    min-width: 44px;
    font-size: 13px;
    font-weight: 600;
    color: #b91c1c;
  }

  .wb-en {
    flex: none;
    font-family: Consolas, "Courier New", monospace;
    font-size: 17px;
    font-weight: 700;
    color: #991b1b;
  }

  .wb-cn {
    margin-left: auto;
    text-align: right;
    font-size: 14px;
    color: #475569;
  }

  /* 全对时的提示 */
  .wb-perfect {
    padding: 26px 0;
    text-align: center;
    font-size: 15px;
    color: #16a34a;
  }

  /* 鼓励语 */
  .modal-cheer {
    margin: 0 0 18px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 1px;
    color: #b45309;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 10px;
  }

  .modal-btn {
    width: 100%;
    padding: 13px;
    font-size: 15px;
  }

  /* 窄屏适配 */
  @media (max-width: 560px) {
    .card { margin: 84px 14px 14px; padding: 26px 20px; }
    .card-stats { margin: 84px 14px 12px; padding: 16px 14px; }
    .topbar { padding: 16px 18px; }

  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 比对时忽略大小写、首尾空格，以及词与词之间多余的空格
function normalize(s) {
  return String(s).trim().toLowerCase().replace(/\s+/g, ' ');
}

function updateStats() {
  const vals = [
    [elStTotal, statTotal],
    [elStRight, statRight],
    [elStWrong, statWrong],
    [elStRate,  statTotal === 0 ? '—' : Math.round((statRight / statTotal) * 100) + '%'],
    [elStRound, roundCount + '/' + ROUND_SIZE]
  ];

  vals.forEach(function (pair) {
    const el = pair[0];
    if (!el) return;
    const next = String(pair[1]);
    if (el.textContent === next) return;   // 没变就不动，避免无谓闪烁

    el.textContent = next;

    // 切进动画：先移除类并强制重排，保证连续更新也能重新播放
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  });
}

// ---- 每轮结束：记录进度、必要时弹出错题本 ----
// 返回 true 表示本轮已满（调用方据此安排「先弹窗再下一题」）
function countRound(word) {
  roundCount += 1;

  // 答错/跳过/超时的词都记进错题本（同一个词只记一次）
  if (word && !roundWrong.some(function (w) { return w.en === word.en; })) {
    roundWrong.push(word);
  }

  if (roundCount >= ROUND_SIZE) {
    // 本轮满了 -> 归零重新计，并再刷新一次界面（让进度显示回到 0/10）
    roundCount = 0;
    updateStats();
    showWrongBook();
    return true;
  }

  updateStats();
  return false;
}

// ---- 错题本弹窗 ----
function showWrongBook() {
  const list = roundWrong.slice();      // 快照，之后清空不影响弹窗内容
  roundWrong = [];

  elWbList.innerHTML = '';

  if (list.length === 0) {
    // 一轮全对
    elWbSub.textContent = '这 ' + ROUND_SIZE + ' 题全部答对';
    const p = document.createElement('div');
    p.className = 'wb-perfect';
    p.textContent = '太棒了，没有错题！';
    elWbList.appendChild(p);
  } else {
    elWbSub.textContent = '这 ' + ROUND_SIZE + ' 题里错了 ' + list.length + ' 个';

    list.forEach(function (w) {
      const row = document.createElement('div');
      row.className = 'wb-row';

      const pos = document.createElement('span');
      pos.className = 'wb-pos';
      pos.textContent = w.pos || '';

      const en = document.createElement('span');
      en.className = 'wb-en';
      en.textContent = String(w.en);

      const cn = document.createElement('span');
      cn.className = 'wb-cn';
      cn.textContent = String(w.cn);

      row.appendChild(pos);
      row.appendChild(en);
      row.appendChild(cn);
      elWbList.appendChild(row);
    });
  }

  elWrongBook.classList.add('show');
  elWbClose.focus();
}

function closeWrongBook() {
  elWrongBook.classList.remove('show');

  // 若本轮是在答题结束时触发的，关闭后自动进下一题
  if (pendingNext) {
    pendingNext = false;
    nextQuestion(true);
  } else {
    elAnswer.focus();
  }
}

// ---- 计时逻辑 ----
//   0s  题目出现
//   10s 没输入 -> 亮出首字母（大写）
//   20s 仍未答对 -> 记错 + 自动跳下一题
function clearTipTimer() {
  if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
}

function clearTimeoutTimer() {
  if (timeoutTimer) { clearTimeout(timeoutTimer); timeoutTimer = null; }
}

function resetTip() {
  clearTipTimer();
  tipCount = 0;
  usedTip = false;
  elTip.className = 'tip';
  elTip.innerHTML = '';
}

// 只把提示条收起来，但保留 tipCount / usedTip 记录
function hideTip() {
  elTip.className = 'tip';
  elTip.innerHTML = '';
}

// 亮出前 tipCount 个字母，剩下的用下划线占位
// 揭晓的字母一律转大写（提示首字母大写）
// mine 是发起这次提示的轮次号；和当前 session 不符说明已过期，直接丢弃
function showTip(mine) {
  if (mine !== session) return;          // 计时已被取消的旧回合
  if (!current || answered) return;

  const word = String(current.en);
  tipCount = Math.min(tipCount + 1, word.length);
  usedTip = true;

  // 逐字符生成掩码：
  //   已揭晓的字母 -> 大写显示
  //   未揭晓的字母 -> 下划线，字母之间用一个空格拉开
  //   词间空格     -> 全角空格，形成明显比字母间隔更宽的空档
  let shown = '';
  for (let i = 0; i < word.length; i++) {
    const ch = word[i];

    if (/\s/.test(ch)) {
      shown += '　';                     // 词与词之间：宽空档
    } else if (i < tipCount) {
      shown += ch.toUpperCase();         // 已揭晓 -> 大写
    } else {
      shown += '_';                      // 未揭晓
    }
  }

  // 只在"非空格"字符之间插一个细空格，让下划线不挤在一起
  shown = shown.replace(/([^　])(?=[^　])/g, '$1 ');

  elTip.innerHTML =
    '<span class="letters">' + shown.trim() + '</span>' +
    '<span class="tip-text">已等待 ' + Math.round(TIP_DELAY / 1000) + ' 秒，'
    + '先给你开头'
    + (tipCount > 1 ? ' ' + tipCount + ' 个字母' : '字母')
    + '　·　' + Math.round(TIMEOUT_DELAY / 1000) + ' 秒未答对将计为错误</span>';
  elTip.className = 'tip show';
}

// 开始本题的计时：10 秒提示 + 20 秒超时判错
function armTip() {
  resetTip();
  clearTipTimer();
  clearTimeoutTimer();

  session += 1;                 // 开启新一轮（作废之前所有在途计时）
  const mine = session;

  // --- 10 秒：亮出首字母 ---
  tipTimer = setTimeout(function tick() {
    if (mine !== session) return;    // 已换题或已作答，丢弃

    // 这 10 秒里用户敲过字就不提示，但仍然继续等
    if (elAnswer.value.trim() === '') {
      showTip(mine);
    }
  }, TIP_DELAY);

  // --- 20 秒：仍未答对 -> 记错并跳下一题 ---
  timeoutTimer = setTimeout(function () {
    if (mine !== session) return;
    if (answered) return;            // 已经答对/答错了
    timeUp();
  }, TIMEOUT_DELAY);
}

// 停掉全部计时：作废当前轮次，在途的定时器即使触发也会被丢弃
function stopTip() {
  session += 1;
  clearTipTimer();
  clearTimeoutTimer();
  hideTip();
}

// 超时未答对：记错，翻开答案给用户看一眼，然后自动跳下一题
function timeUp() {
  if (answered || !current) return;
  answered = true;
  stopTip();

  statTotal += 1;
  statWrong += 1;
  const roundDone = countRound(current);   // 推进本轮计数，可能触发错题本

  const ans = String(current.en);

  elPanel.classList.add('wrong');      // 红色荧光
  elAnswer.disabled = true;
  elSubmit.disabled = true;
  elFbText.innerHTML = '超过 ' + Math.round(TIMEOUT_DELAY / 1000)
    + ' 秒未答对，答案是 <b>' + ans + '</b>';
  elFeedback.className = 'feedback show no';
  showActions();

  setTimeout(function () {
    if (roundDone) {
      pendingNext = true;            // 关掉错题本后再继续
    } else {
      nextQuestion(true);
    }
  }, CARD_HOLD_MS + 900);
}

// ---- 出题 ----
// withSlide=true 时先做向左滑出 + 右侧滑入的翻页动画
// keepLocked=true 时在翻页结束前不移除 answered 锁（防止连点重复计分）
function nextQuestion(withSlide, keepLocked) {
  if (!keepLocked) answered = false;
  stopTip();                // 作废上一题的提示与超时计时，避免跨题误触
  elAnswer.value = '';
  elAnswer.disabled = false;
  elAnswer.classList.remove('right', 'wrong');
  elSubmit.disabled = false;
  elPanel.classList.remove('right', 'wrong');
  elFeedback.className = 'feedback';
  elFbText.textContent = '';

  showActions();

  // 一轮答完就重新洗牌，无限刷
  if (index >= pool.length) {
    pool = shuffle(pool);
    index = 0;
  }

  current = pool[index];
  index += 1;

  // 立刻切换内容的场合：没有动画时直接显示新题
  function paint() {
    elQuestion.textContent = current.cn;

    // 词性可选：没有就留空，样式会把整个徽标隐藏
    elPos.textContent = current.pos ? String(current.pos) : '';

    answered = false;              // 新题就绪，解除锁定
    elAnswer.value = '';
    elAnswer.disabled = false;
    elSubmit.disabled = false;
    elAnswer.focus();
    armTip();
  }

  if (!withSlide) {
    paint();
    return;
  }

  // ---- 翻页动画 ----
  // 顺序：旧内容左滑出场 → 换上新题 → 新内容从右滑入场
  elPanel.classList.add('out');

  // 等旧页滑完再换内容，避免用户看到文字在中途突变
  setTimeout(function () {
    elPanel.classList.remove('out');
    paint();                       // 此刻是"空白页"，换内容用户看不到跳变

    elPanel.classList.add('in');
    setTimeout(function () {
      elPanel.classList.remove('in');
    }, SLIDE_MS);

  }, SLIDE_MS);
}

// 反馈区只保留「下一题」按钮，这里统一控制显隐
function showActions() {
  elNext.style.display = '';
}

// 卡片抖动一下
function shakeCard() {
  elCard.classList.remove('shake');
  // 强制重排，保证连续答错时动画能重新触发
  void elCard.offsetWidth;
  elCard.classList.add('shake');
  setTimeout(function () { elCard.classList.remove('shake'); }, 500);
}

// ---- 判分 ----
function judge() {
  if (answered || !current) return;

  const input = elAnswer.value;
  if (!input.trim()) {
    elAnswer.focus();
    return;
  }

  answered = true;
  stopTip();                // 停止提示计时并收起提示条

  const isRight = normalize(input) === normalize(current.en);

  if (isRight) {
    // ---- 答对：亮绿光，自动翻页 ----
    statTotal += 1;
    statRight += 1;
    const roundDone = countRound(null);   // 答对不计入错题本

    elAnswer.classList.add('right');
    elPanel.classList.add('right');      // 绿色荧光
    elFbText.innerHTML = '答对了！';
    elFeedback.className = 'feedback show ok';
    showActions();

    elAnswer.disabled = true;
    elSubmit.disabled = true;
    elNext.focus();

    // 略微停顿让绿光被看见，然后自动翻页
    // 本轮满了：先让错题本弹出来，关掉后再继续
    if (CARD_HOLD_MS > 0) {
      setTimeout(function () {
        if (roundDone) {
          // 弹窗已由 countRound 弹出，等用户关闭后由 closeWrongBook 推进
          pendingNext = true;
        } else {
          nextQuestion(true);
        }
      }, CARD_HOLD_MS);
    }

  } else {
    // ---- 答错：抖动 + 红光 + 直接记错并切下一题 ----
    statTotal += 1;
    statWrong += 1;
    const roundDone = countRound(current);

    elPanel.classList.add('wrong');
    shakeCard();

    elFbText.innerHTML = '答错了，正确答案是 <b>' + current.en + '</b>';
    elFeedback.className = 'feedback show no';
    showActions();

    elAnswer.disabled = true;
    elSubmit.disabled = true;

    // 直接切下一题（先亮一下红光和答案）
    setTimeout(function () {
      if (roundDone) {
        pendingNext = true;      // 关掉错题本后再继续
      } else {
        nextQuestion(true);
      }
    }, CARD_HOLD_MS + 900);
  }
}

// ---- 跳过：直接记错并切下一题 ----
function skip() {
  if (answered) return;               // 本题已判过，避免重复计分
  answered = true;
  stopTip();

  const ans = current ? String(current.en) : '';
  const roundDone = countRound(current);

  statTotal += 1;
  statWrong += 1;

  elPanel.classList.remove('wrong');

  // 本轮满了：先把错题本弹出来，关掉后再翻页
  if (roundDone) {
    elFbText.innerHTML = '已跳过，答案是 <b>' + ans + '</b>';
    elFeedback.className = 'feedback show no';
    showActions();
    pendingNext = true;
    return;
  }

  // 翻页期间保持 answered=true，防止连点重复计分；
  // 翻页动画走完后再由 nextQuestion 复位
  nextQuestion(true, true);

  // 等翻页动画走完再告诉用户答案
  setTimeout(function () {
    elFbText.innerHTML = '已跳过，答案是 <b>' + ans + '</b>';
    elFeedback.className = 'feedback show no';
    showActions();
  }, SLIDE_MS * 2);
}

// ---- 事件 ----
elSubmit.addEventListener('click', judge);

// 用户开始输入就撤掉已弹出的提示（10 秒提示仍会照常触发）
elAnswer.addEventListener('input', function () {
  if (answered) return;
  if (elAnswer.value.trim() !== '') {
    hideTip();           // 收起提示条，但保留计时
  }
});

// 回车提交
elAnswer.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  judge();
});

// 答对/答错后点「下一题」
elNext.addEventListener('click', function () {
  nextQuestion(true);
});

// 左下角「跳过」
elSkip.addEventListener('click', skip);

// 关闭错题本
elWbClose.addEventListener('click', closeWrongBook);

// 点击遮罩空白处也能关闭
elWrongBook.addEventListener('click', function (e) {
  if (e.target === elWrongBook) closeWrongBook();
});

// Esc 关闭
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && elWrongBook.classList.contains('show')) {
    closeWrongBook();
  }
});

elReset.addEventListener('click', function () {
  statTotal = statRight = statWrong = 0;
  roundCount = 0;
  roundWrong = [];
  pendingNext = false;
  elWrongBook.classList.remove('show');
  updateStats();
  start();
});

// ---- 启动 ----
function start() {
  const words = (typeof WORDS !== 'undefined' && Array.isArray(WORDS))
    ? WORDS.filter(function (w) {
        return w && typeof w.cn === 'string' && typeof w.en === 'string';
      })
    : [];

  if (words.length === 0) {
    elGame.style.display = 'none';
    elEmpty.classList.add('show');
    elStatsCard.style.display = 'none';   // 没词库时统计方块也没意义
    return;
  }

  elStatsCard.style.display = '';
  pool = shuffle(words);
  index = 0;
  updateStats();
  nextQuestion();
}

start();
</script>
